name: Actualizar Lista M3U

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio esport
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar requests y Playwright
        run: pip install requests playwright

      - name: Instalar navegador virtual
        continue-on-error: true
        run: playwright install --with-deps chromium

      - name: Ejecutar script de extraccion
        run: python actualizar.py

      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lista.m3u
          git diff --staged --quiet || (git commit -m "Auto-actualizacion de lista.m3u" && git push)
